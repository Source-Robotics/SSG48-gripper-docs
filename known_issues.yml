# The known issues of the SSG-48's firmware (the Spectral Micro driver's, in gripper mode) and of the software that
# drives it, in ONE place. hooks/known_issues.py writes them into the Known issues page (<!-- known-issues -->, all of
# them) and wherever <!-- known-issues: COMPONENT --> stands (one component). tools/test_tools.py checks the file.
# The same format as PAROL-docs' known_issues.yml.
#
# An issue stays here when it is fixed: set status: fixed and fixed_in to the version that fixes it, and the page
# moves it to "Fixed". Never renumber: the id is how people refer to an issue.
#
#   id          KI-<number>, never reused
#   component   a key under components:
#   summary     what happens, in one or two sentences
#   workaround  what to do until it is fixed
#   page        the docs page that describes it (path under docs/, an #anchor allowed), and title, its link text
#   status      open or fixed; fixed_in: the version that fixes it (when fixed)
#   since       the date the issue was recorded

components:
  firmware: {name: Spectral driver firmware, version: "110"}
  python: {name: Python library (Spectral-BLDC), version: "1.21"}
  parol6_api: {name: PAROL6 Python API (parol6), version: "0.9.1"}

issues:
  - id: KI-1
    component: firmware
    summary: A gripper E-stop raises the E-stop error again at every control cycle for as long as the last gripper
      command carries the E-stop bit, so Send_Clear_Error (or `#Clear`) seems to do nothing.
    workaround: Send a gripper command with the E-stop bit at 0 and the action bit at 0 (or `#Gripstop 0`), then
      clear.
    page: 06-operation/errors.md#clearing
    title: Errors and recovery, clearing
    status: open
    since: 2026-11-03

  - id: KI-2
    component: firmware
    summary: The answer to a full Send_gripper_data_pack is sent before the gripper acts on the command, so it carries
      the state from before it.
    workaround: Ignore that answer, and follow the move with empty frames. On firmware 109 and older, also give a
      move about 100 ms before you trust its object detection.
    page: 06-operation/can.md#host-checklist
    title: Over CAN, host checklist
    status: open
    since: 2026-11-03

  - id: KI-3
    component: firmware
    summary: A full gripper command or a clear sent during the gripper calibration ends it, and the gripper stays
      uncalibrated. The routine's counters are not reset, so the next calibration starts where the stopped one was
      (it can skip the opening) and counts the time already spent towards its 30 s limit.
    workaround: Send only empty frames until the calibrated bit is 1. If a calibration was stopped, calibrate again
      and check the bit; if it does not come, switch the gripper off and on and calibrate.
    page: 06-operation/can.md#host-checklist
    title: Over CAN, host checklist
    status: fixed
    fixed_in: "110: a new calibration starts from the beginning, with its whole 30 s; a command or a clear still ends a
      running one, and the gripper keeps the calibration it had before"
    since: 2026-11-03

  - id: KI-4
    component: firmware
    summary: The action status in the gripper's answer is the action bit of the last command; the firmware never
      clears it, neither at the end of a move nor in the calibration.
    workaround: Follow a move by its object detection and the position, not by the action status.
    page: reference/errors.md#the-grippers-state-byte
    title: The gripper's state byte
    status: open
    since: 2026-11-03

  - id: KI-5
    component: firmware
    summary: The motor calibration (`#Cal`) sets the driver's current limit to 1600 mA and leaves it there, and
      `#Save` stores it. Gripper moves are not affected, they use each command's current; the driver's own modes,
      such as the current and position modes of the teleoperation guide, run with up to 1600 mA.
    workaround: On a self-built gripper, set `#Ilim` (1000 mA, the default, suits the GBM5208-75) after `#Cal` and
      before `#Save`.
    page: build/first-run.md#current-limit
    title: Driver setup and first run, current limit
    status: fixed
    fixed_in: "109: calibration puts back the current limit that was in force when it started"
    since: 2026-11-03

  - id: KI-6
    component: firmware
    summary: With braking in idle switched on (Send_Settings, parameter 18, or `#Brake 1`), the current that turning
      the motor drives through its shorted phases is not limited. Until firmware 110 the setting was not saved
      either (KI-14).
    workaround: Leave the default, coasting, unless you need the brake, and do not force the jaws by hand while it
      brakes.
    page: reference/can/system.md#send_idle
    title: Send_Idle
    status: open
    since: 2026-11-03

  - id: KI-7
    component: python
    summary: "`gripper_object_detection` has its two bits swapped: the library reports 1 where the gripper sends 2
      (object found while opening) and 2 where it sends 1 (object found while closing); 0 and 3 are right."
    workaround: Swap 1 and 2 in your program, or test for "1 or 2" when any object will do.
    page: 06-operation/python.md
    title: With Python
    status: fixed
    fixed_in: "1.21: `gripper_object_detection` reads the two bits the right way round"
    since: 2026-11-03

  - id: KI-8
    component: parol6_api
    summary: "In `rbt.tool.status()`, `engaged` is always true (it is read from the speed field, which the robot
      always reports as 1), and `part_detected` reads bits 3 and 2 of the gripper's state byte, the temperature and
      timeout errors, not the object detection in bits 5 and 4."
    workaround: To know that a part is held, check the position the jaws stopped at, or use a sensor.
    page: 06-operation/robots.md#driving-it
    title: On PAROL6 and PAR6, driving it
    status: open
    since: 2026-11-03

  - id: KI-9
    component: parol6_api
    summary: "`rbt.tool.calibrate()` counts the calibration done after a fixed 2 s without reading the calibrated
      bit, and the SSG-48 takes about 3 s, longer when the jaws start far from the open end. The API has no action
      to clear a gripper error."
    workaround: Wait for the calibration before the first move, as the example on the PAROL6 page does; clear an error
      in the commander's Gripper tab or with Motor GUI, then calibrate.
    page: 06-operation/robots.md#driving-it
    title: On PAROL6 and PAR6, driving it
    status: open
    since: 2026-11-03

  - id: KI-10
    component: firmware
    summary: A status poll (an empty Send_gripper_data_pack) or a repeat of the command that reaches the driver within
      one control cycle (about 0.2 ms) of a new move command cancels it as new. The move then runs in position mode,
      and object detection reads 3 while the jaws press on an object.
    workaround: Read the move's answer, or wait a millisecond, before the first poll; the examples on these pages do.
    page: 06-operation/can.md#host-checklist
    title: Over CAN, host checklist
    status: fixed
    fixed_in: "109: only a new command marks itself new, so a poll or a repeat no longer cancels the move"
    since: 2026-11-10

  - id: KI-11
    component: firmware
    summary: After a move the current took a second or more to settle, and some of it stayed while the gripper held
      the position. The velocity loop carried the current of the move into the hold and unwound it slowly through
      the mechanism's friction.
    workaround: Update the firmware to 110. The integral deadband (parameter 75) does not help, it keeps the current
      of the move.
    page: 06-operation/how-it-works.md#the-states
    title: How the gripper works, the states
    status: fixed
    fixed_in: "110: the integral is dropped on arrival, the last stretch is slower and the hold has a small dead zone;
      a few mA are left after a move"
    since: 2026-11-13

  - id: KI-12
    component: firmware
    summary: The gripper calibration read the two ends while it pushed into the stops at 500 mA, so positions 0 and
      255 lay inside the stops. A full open or close with less current stopped short, kept pressing on the stop with
      the grip current, and often reported an object (1 or 2) instead of 3; a gripper a few ticks short of 255
      reported 254.
    workaround: Command positions a few steps inside 0 and 255, or update the firmware to 110.
    page: 06-operation/how-it-works.md#the-states
    title: How the gripper works, the states
    status: fixed
    fixed_in: "110: each end is read under a light 100 mA push; 0 lies 32 encoder ticks inside the open stop, 255 16
      ticks from the closed one; the position is rounded to the nearest step"
    since: 2026-11-13

  - id: KI-13
    component: firmware
    summary: Gripper moves set the driver's current limit (`#Ilim`, parameter 16) to the current of each command, and
      the gripper calibration set it to 500 mA. A Send_Save_config or `#Save` then stored that as the driver's limit.
    workaround: Set `#Ilim` (parameter 16) again right before you save.
    page: build/first-run.md#current-limit
    title: Driver setup and first run, current limit
    status: fixed
    fixed_in: "110: the gripper and its calibration push with their own current; the driver's limit stays as set"
    since: 2026-11-13

  - id: KI-14
    component: firmware
    summary: Brake or coast when idle (parameter 18) was not saved. After every power-up the driver coasted, whatever
      was set before Send_Save_config.
    workaround: Set brake or coast again after every power-up.
    page: reference/can/system.md#parameters-a-gripper-uses
    title: System, parameters a gripper uses
    status: fixed
    fixed_in: "110: Send_Save_config keeps it; a driver that never saved it coasts, as before"
    since: 2026-11-13

  - id: KI-15
    component: firmware
    summary: With the watchdog's action set to hold or descend, a watchdog that ran out while the gripper was idle
      started the hold or the descend later, when the next gripper command arrived, for the whole fallback time.
    workaround: Clear the watchdog error before you send the next gripper command.
    page: reference/can/system.md#send_watchdog
    title: System, Send_Watchdog
    status: fixed
    fixed_in: "110: hold and descend start only when the watchdog runs out in gripper mode"
    since: 2026-11-13
